name: Android Build

on:
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  build-debug:
    name: Build Debug APK
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: flutter pub get
      - run: flutter build apk --debug --split-per-abi
      - name: Rename and Filter APKs
        run: |
          cd build/app/outputs/flutter-apk/
          # Filter out x86_64
          rm -f app-x86_64-debug.apk
          # Rename remaining
          for apk in app-*-debug.apk; do
            arch=$(echo $apk | sed -E 's/app-(.*)-debug.apk/\1/')
            mv "$apk" "purenote_${arch}_debug.apk"
          done
      - name: Upload arm64-v8a artifact
        uses: actions/upload-artifact@v4
        with:
          name: purenote-android-arm64-v8a-debug
          path: build/app/outputs/flutter-apk/purenote_arm64-v8a_debug.apk
      - name: Upload armeabi-v7a artifact
        uses: actions/upload-artifact@v4
        with:
          name: purenote-android-armeabi-v7a-debug
          path: build/app/outputs/flutter-apk/purenote_armeabi-v7a_debug.apk

  build-release:
    name: Build Release APK
    needs: build-debug
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v3
        with:
          distribution: 'zulu'
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
      - run: flutter pub get
      
      - name: Inject Keystore and Properties
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          echo $KEYSTORE_BASE64 | base64 --decode > android/app/upload-keystore.jks
          echo "storeFile=upload-keystore.jks" > android/key.properties
          echo "storePassword=$KEYSTORE_PASSWORD" >> android/key.properties
          echo "keyPassword=$KEY_PASSWORD" >> android/key.properties
          echo "keyAlias=$KEY_ALIAS" >> android/key.properties

      - run: flutter build apk --release --split-per-abi
      
      - name: Rename and Filter APKs
        run: |
          cd build/app/outputs/flutter-apk/
          # Filter out x86_64
          rm -f app-x86_64-release.apk
          # Rename remaining
          for apk in app-*-release.apk; do
            arch=$(echo $apk | sed -E 's/app-(.*)-release.apk/\1/')
            mv "$apk" "purenote_${arch}_release.apk"
          done
          
      - name: Upload arm64-v8a artifact
        uses: actions/upload-artifact@v4
        with:
          name: purenote-android-arm64-v8a-release
          path: build/app/outputs/flutter-apk/purenote_arm64-v8a_release.apk
          
      - name: Upload armeabi-v7a artifact
        uses: actions/upload-artifact@v4
        with:
          name: purenote-android-armeabi-v7a-release
          path: build/app/outputs/flutter-apk/purenote_armeabi-v7a_release.apk
